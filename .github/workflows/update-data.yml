name: Update Data

on:
  schedule:
    # UTC 0:00 = 北京时间 8:00
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data (daily prices from Tencent API)
        id: fetch
        run: python scripts/fetch_data.py
        continue-on-error: true

      - name: Log fetch failure
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::fetch_data.py 执行失败，保留旧数据不变，后续步骤继续执行"

      - name: Build data (sort, deduplicate, normalize)
        run: python scripts/build_data.py

      - name: Validate data (quality check)
        run: python scripts/validate_data.py

      - name: Commit and push data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no data changes, skip commit"
          else
            git commit -m "Auto: 数据更新 $(TZ='Asia/Shanghai' date +'%Y-%m-%d')"
            git push
          fi
